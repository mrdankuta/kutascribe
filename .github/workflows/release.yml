name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            features: --no-default-features
            bins: kutascribe
            apt: ffmpeg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            features: --no-default-features
            bins: kutascribe
          - os: macos-14
            target: x86_64-apple-darwin
            features: --no-default-features
            bins: kutascribe
          - os: macos-14
            target: aarch64-apple-darwin
            features: --no-default-features
            bins: kutascribe
    runs-on: ${{ matrix.os }}
    env:
      # Portable ggml: do NOT use -march=native (CI runners have AVX512,
      # user CPUs like i9-13900H don't -> SIGILL). Runtime dispatch instead.
      GGML_NATIVE: OFF
      GGML_AVX512: OFF
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}
      - run: cargo build --release --target ${{ matrix.target }} ${{ matrix.features }} --bin kutascribe-cli
      - run: cargo build --release --target ${{ matrix.target }} --bin kutascribe-gui
        if: runner.os == 'Linux'
      - name: Rename with OS/ARCH
        shell: bash
        run: |
          mkdir -p dist
          # CLI (all OSes) — arch in filename, no more collisions
          if [ -f target/${{ matrix.target }}/release/kutascribe-cli ]; then
            cp target/${{ matrix.target }}/release/kutascribe-cli dist/kutascribe-cli-${{ matrix.target }}
          fi
          if [ -f target/${{ matrix.target }}/release/kutascribe-cli.exe ]; then
            cp target/${{ matrix.target }}/release/kutascribe-cli.exe dist/kutascribe-cli-${{ matrix.target }}.exe
          fi
          # GUI (Linux only for now)
          if [ -f target/${{ matrix.target }}/release/kutascribe-gui ]; then
            cp target/${{ matrix.target }}/release/kutascribe-gui dist/kutascribe-gui-${{ matrix.target }}
          fi
          ls -lh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: bins-${{ matrix.target }}
          path: dist/*

  appimage:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bins-x86_64-unknown-linux-gnu*
          path: dist-bin
      - run: ARCH=x86_64 chmod +x packaging/appimage.sh && ARCH=x86_64 packaging/appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AppImage
          path: "*.AppImage"

  publish:
    needs: [build, appimage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -R dist; chmod +x dist/kutascribe* 2>/dev/null || true
      - uses: softprops/action-gh-release@v2
        with:
          body: |
            ## kutascribe ${{ github.ref_name }}

            | Asset | OS | Arch | Format |
            |---|---|---|---|
            | `kutascribe-cli-x86_64-unknown-linux-gnu` | Linux | x86_64 | binary (chmod +x) |
            | `kutascribe-gui-x86_64-unknown-linux-gnu` | Linux | x86_64 | binary GUI |
            | `Kutascribe-x86_64.AppImage` | Linux | x86_64 | AppImage (needs ffmpeg) |
            | `kutascribe-cli-x86_64-pc-windows-msvc.exe` | Windows | x86_64 | .exe |
            | `kutascribe-cli-x86_64-apple-darwin` | macOS Intel | x86_64 | binary |
            | `kutascribe-cli-aarch64-apple-darwin` | macOS Apple Silicon | arm64 | binary |
            Models auto-download to `~/.cache/kutascribe/models/` on first run. Needs `ffmpeg` on PATH.
          files: |
            dist/kutascribe-cli-*
            dist/kutascribe-gui-*
            dist/*.AppImage
