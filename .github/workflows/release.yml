name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            features: --no-default-features
            bins: kutascribe
            apt: ffmpeg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            features: --no-default-features
            bins: kutascribe
          - os: macos-14
            target: x86_64-apple-darwin
            features: --no-default-features
            bins: kutascribe
          - os: macos-14
            target: aarch64-apple-darwin
            features: --no-default-features
            bins: kutascribe
    runs-on: ${{ matrix.os }}
    env:
      # Portable ggml: do NOT use -march=native (CI runners have AVX512,
      # user CPUs like i9-13900H don't -> SIGILL). Runtime dispatch instead.
      GGML_NATIVE: OFF
      GGML_AVX512: OFF
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}
      - run: cargo build --release --target ${{ matrix.target }} ${{ matrix.features }} --bin kutascribe
      - run: cargo build --release --target ${{ matrix.target }} --bin kutascribe-app
        if: runner.os == 'Linux'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          path: |
            target/${{ matrix.target }}/release/kutascribe*
            target/${{ matrix.target }}/release/kutascribe-app*

  appimage:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: x86_64-unknown-linux-gnu-*
          path: dist-bin
      - run: ARCH=x86_64 chmod +x packaging/appimage.sh && ARCH=x86_64 packaging/appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AppImage
          path: "*.AppImage"

  publish:
    needs: [build, appimage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -R dist; chmod +x dist/kutascribe* 2>/dev/null || true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**
