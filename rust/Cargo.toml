[package]
name = "kutascribe"
version = "0.2.2"
edition = "2021"
description = "Local GPU speech-to-text for audio+video -> timestamped .txt (single binary)"
license = "MIT"

[lib]
name = "kutascribe"
path = "src/lib.rs"

[[bin]]
name = "kutascribe"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
hound = "3.5"
walkdir = "2.5"
# GPU opt-in (CPU portable by default for `cargo install` everywhere).
# Local GPU: cargo build --features vulkan (needs vulkan-headers+shaderc) or --features metal (mac) / --features cuda
whisper-rs = { version = "0.16", default-features = false }
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }
indicatif = "0.17"
dirs = "5.0"
glob = "0.3"

[features]
default = []
vulkan = ["whisper-rs/vulkan"]
cuda = ["whisper-rs/cuda"]
metal = ["whisper-rs/metal"]
