[project]
name = "kutascribe"
version = "0.1.0"
description = "Fast GPU speech-to-text for audio + video -> timestamped .txt (Whisper large-v3-turbo)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "you" }]
dependencies = [
  "faster-whisper>=1.0.0",
  "tqdm>=4.60",
]
# GPU users on CUDA systems: uv pip install -e ".[gpu]"
# This pulls the CUDA12 runtime wheels so you don't hit libcublas.so.12 errors
[project.optional-dependencies]
gpu = [
  "nvidia-cublas-cu12",
  "nvidia-cudnn-cu12",
]

[project.scripts]
kutascribe = "kutascribe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kutascribe"]

[tool.uv]
package = true
